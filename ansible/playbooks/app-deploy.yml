---
- name: Deploy Task Manager to the kind cluster
  hosts: taskmanager
  gather_facts: false
  vars:
    manifests_dir: "{{ playbook_dir }}/../../k8s"
  tasks:
    - name: Apply namespace
      ansible.builtin.command: >
        kubectl --context {{ kubernetes_context }} apply -f {{ manifests_dir }}/namespace.yaml
      register: ns
      changed_when: "'created' in ns.stdout or 'configured' in ns.stdout"

    - name: Apply Postgres and app manifests
      ansible.builtin.command: >
        kubectl --context {{ kubernetes_context }} apply -f {{ manifests_dir }}/postgres.yaml -f {{ manifests_dir }}/taskmanager.yaml
      register: apply
      changed_when: "'created' in apply.stdout or 'configured' in apply.stdout"

    - name: Wait for Postgres rollout
      ansible.builtin.command: >
        kubectl --context {{ kubernetes_context }} -n {{ kubernetes_namespace }} rollout status deployment/postgres --timeout=120s
      changed_when: false

    - name: Wait for app rollout
      ansible.builtin.command: >
        kubectl --context {{ kubernetes_context }} -n {{ kubernetes_namespace }} rollout status deployment/taskmanager --timeout=120s
      changed_when: false