{% extends 'base.html' %}
{% block title %}Login | Task Manager{% endblock %}
{% block content %}
<div class="auth-layout">
  <section class="card auth-card">
    <div class="card-body">
      <div class="auth-icon"><i class="bi bi-person-check" aria-hidden="true"></i></div>
      <p class="eyebrow">WELCOME BACK</p>
      <h1 class="auth-title">Log in to your space</h1>
      <p class="auth-intro">Pick up where you left off.</p>
      {% if error %}
      <div class="alert alert-danger auth-error" role="alert">
        <i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i>{{ error }}
      </div>
      {% endif %}
      <form method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-icon-wrap">
            <i class="bi bi-person" aria-hidden="true"></i>
            <input type="text" class="form-control{% if error %} is-invalid{% endif %}" name="username" id="username" autocomplete="username" placeholder="Your username" required aria-invalid="{{ 'true' if error else 'false' }}">
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-icon-wrap">
            <i class="bi bi-lock" aria-hidden="true"></i>
            <input type="password" class="form-control{% if error %} is-invalid{% endif %}" name="password" id="password" autocomplete="current-password" placeholder="Your password" required aria-invalid="{{ 'true' if error else 'false' }}">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 auth-submit">
          <i class="bi bi-arrow-right-circle me-2" aria-hidden="true"></i>Login
        </button>
      </form>
      <p class="auth-switch mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
  </section>
</div>
{% endblock %}
