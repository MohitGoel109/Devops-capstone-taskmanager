{% extends 'base.html' %}
{% block title %}Register | Task Manager{% endblock %}
{% block content %}
<div class="auth-layout">
  <section class="card auth-card">
    <div class="card-body">
      <div class="auth-icon auth-icon-warm"><i class="bi bi-person-plus" aria-hidden="true"></i></div>
      <p class="eyebrow">A FRESH START</p>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-intro">A little more focus starts here.</p>
      {% if error %}
      <div class="alert alert-danger auth-error" role="alert">
        <i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i>{{ error }}
      </div>
      {% endif %}
      <form method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-icon-wrap">
            <i class="bi bi-person" aria-hidden="true"></i>
            <input type="text" class="form-control{% if error %} is-invalid{% endif %}" name="username" id="username" autocomplete="username" placeholder="Choose a username" required aria-invalid="{{ 'true' if error else 'false' }}">
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-icon-wrap">
            <i class="bi bi-lock" aria-hidden="true"></i>
            <input type="password" class="form-control{% if error %} is-invalid{% endif %}" name="password" id="password" autocomplete="new-password" placeholder="Create a password" required aria-invalid="{{ 'true' if error else 'false' }}">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 auth-submit">
          <i class="bi bi-person-check me-2" aria-hidden="true"></i>Create account
        </button>
      </form>
      <p class="auth-switch mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </section>
</div>
{% endblock %}
