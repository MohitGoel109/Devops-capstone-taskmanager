services:
  jenkins:
    build:
      context: ../..
      dockerfile: docker/jenkins/Dockerfile
    image: taskmanager-jenkins:local
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins-home: