apiVersion: v1
kind: Secret
metadata:
  name: taskmanager-secret
  namespace: taskmanager
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-local-password
  SECRET_KEY: replace-with-a-long-random-key
  DATABASE_URL: postgresql+psycopg2://taskmanager:replace-with-a-local-password@postgres:5432/taskmanager