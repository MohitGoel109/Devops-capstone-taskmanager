apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskmanager-alerts
  namespace: monitoring
spec:
  groups:
    - name: taskmanager
      rules:
        - alert: TaskManagerDown
          expr: absent(up{job="taskmanager"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Task Manager target is down
        - alert: PodRestartingOften
          expr: increase(kube_pod_container_status_restarts_total{namespace="taskmanager"}[10m]) > 3
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Pod restarting more than 3 times in 10 minutes
        - alert: High5xxRate
          expr: sum(rate(flask_http_request_total{status=~"5.."}[2m])) / sum(rate(flask_http_request_total[2m])) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of requests return 5xx
